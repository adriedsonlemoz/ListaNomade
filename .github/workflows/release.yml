name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Validar Secrets de assinatura
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 ausente"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD ausente"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS ausente"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD ausente"; exit 1; }

      - name: Preparar chave permanente
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/lista-nomade-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lista-nomade-signing/release.jks"

      - name: Validar identidade e versões
        run: python3 scripts/verify_versions.py

      - name: Compilar Release assinado
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lista-nomade-signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean :app:assembleRelease --no-daemon

      - name: Preparar arquivos da Release
        id: version
        shell: bash
        run: |
          VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK" || { echo "APK Release não encontrado"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "Tag $GITHUB_REF_NAME não corresponde à versão v${VERSION}"
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "dist/Lista-Nomade-v${VERSION}.apk"
          git archive --format=zip --output="dist/Lista-Nomade-v${VERSION}-source.zip" HEAD
          test -f "dist/Lista-Nomade-v${VERSION}.apk"
          test -f "dist/Lista-Nomade-v${VERSION}-source.zip"

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Lista Nômade v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Lista-Nomade-v${{ steps.version.outputs.version }}.apk
            dist/Lista-Nomade-v${{ steps.version.outputs.version }}-source.zip
